map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: only used for the ACME challenge (certbot proves domain
# ownership by fetching a file from here) and to bounce everything else to
# HTTPS. See init-letsencrypt.sh for the one-time bootstrap this depends on.
server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxies to the server container over the internal docker
    # network (see docker-compose.yml's service name "server") - the server
    # itself is never published on a host port. Works the same whether the
    # BROWSER connected via ws:// or wss:// - nginx already terminated TLS
    # by the time the request reaches this block, so the proxy_pass to the
    # backend is always plain ws:// regardless.
    location /ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A turn-based match's socket can sit idle for a while between
        # moves - nginx's default proxy timeouts (~60s) would silently
        # drop it well before then and look like a dead connection.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
